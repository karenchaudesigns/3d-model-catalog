title: "Karen Chau Designs | 3D Model Portfolio & Catalog"
tagline: "Functional, sculptural, and print-in-place 3D printing designs."
description: "Explore original 3D printing models by Karen Chau Designs—useful prints, geometric home decor, seasonal collections, and fan favorites available on MakerWorld, Printables, and Thangs."
author: "Karen Chau Designs"
url: "https://models.karenchaudesigns.com"
baseurl: ""

markdown: kramdown
permalink: pretty

# Custom Collections
collections:
  models:
    output: true
    permalink: /models/:name/

# Front Matter Defaults
defaults:
  - scope:
      path: ""
      type: "models"
    values:
      layout: "model"
  - scope:
      path: "categories"
    values:
      layout: "category"

# Product Categories Configuration (SEO naming: category-[name]-3dmodels.webp, 800x800px)
catalog_categories:
  - slug: "useful-prints"
    title: "Useful Prints"
    description: "Modular desk organizers, workshop helpers, and everyday functional prints."
    image: "/images/categories/category-useful-prints-3dmodels.webp"
    url: "/categories/useful-prints/"
  - slug: "gifts-decor"
    title: "Gifts & Decor"
    description: "Sculptural planters, ribbed vases, and modern architectural accents."
    image: "/images/categories/category-gifts-decor-3dmodels.webp"
    url: "/categories/gifts-decor/"
  - slug: "seasonal"
    title: "Seasonal"
    description: "Festive tabletop decor, geometric ornaments, and holiday printables."
    image: "/images/categories/category-seasonal-3dmodels.webp"
    url: "/categories/seasonal/"
  - slug: "fan-favorites"
    title: "Fan Favorites"
    description: "Most downloaded articulated models, fidgets, and community-loved prints."
    image: "/images/categories/category-fan-favorites-3dmodels.webp"
    url: "/categories/fan-favorites/"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
